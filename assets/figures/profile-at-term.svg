<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 438" width="840" height="438" role="img" aria-labelledby="t d" font-family="Geist, ui-sans-serif, -apple-system, sans-serif"><title id="t">What a mature profile looks like</title><desc id="d">An illustrative mature profile: five traits past their reliability floor, a demonstrated difficulty ceiling at intermediate, and a readiness verdict of reliable.</desc><rect width="840" height="438" fill="#FFFDF7"/><text x="20.0" y="26.0" font-size="15" fill="#171307" text-anchor="start" font-weight="500">What the tutor knows after a term of real work</text><text x="20.0" y="46.0" font-size="11.5" fill="#7D7360" text-anchor="start" font-weight="400">Illustrative, not a measurement. It shows the shape of a mature profile, not one student's numbers.</text><text x="20.0" y="74.0" font-size="10" fill="#7D7360" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">TRAIT</text><text x="702.0" y="74.0" font-size="10" fill="#7D7360" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">READING</text><text x="216.0" y="115.0" font-size="12.5" fill="#171307" text-anchor="end" font-weight="400">Competence</text><rect x="232" y="103.0" width="458" height="14" rx="4" fill="#F7F1DF"/><rect x="232" y="103.0" width="329.8" height="14" rx="4" fill="#2563EB" fill-opacity="0.85"/><text x="702.0" y="115.0" font-size="10.5" fill="#7D7360" text-anchor="start" font-weight="400">solves unaided at intermediate</text><text x="553.8" y="115.0" font-size="10" fill="#FFFDF7" text-anchor="end" font-weight="500" font-family="'Geist Mono', ui-monospace, Menlo, monospace">0.72</text><text x="216.0" y="157.0" font-size="12.5" fill="#171307" text-anchor="end" font-weight="400">Help orientation</text><rect x="232" y="145.0" width="458" height="14" rx="4" fill="#F7F1DF"/><rect x="232" y="145.0" width="371.0" height="14" rx="4" fill="#2563EB" fill-opacity="0.85"/><text x="702.0" y="157.0" font-size="10.5" fill="#7D7360" text-anchor="start" font-weight="400">tries before asking, almost always</text><text x="595.0" y="157.0" font-size="10" fill="#FFFDF7" text-anchor="end" font-weight="500" font-family="'Geist Mono', ui-monospace, Menlo, monospace">0.81</text><text x="216.0" y="199.0" font-size="12.5" fill="#171307" text-anchor="end" font-weight="400">Uptake speed</text><rect x="232" y="187.0" width="458" height="14" rx="4" fill="#F7F1DF"/><rect x="232" y="187.0" width="293.1" height="14" rx="4" fill="#2563EB" fill-opacity="0.85"/><text x="702.0" y="199.0" font-size="10.5" fill="#7D7360" text-anchor="start" font-weight="400">acts on a hint inside a few seconds</text><text x="517.1" y="199.0" font-size="10" fill="#FFFDF7" text-anchor="end" font-weight="500" font-family="'Geist Mono', ui-monospace, Menlo, monospace">0.64</text><text x="216.0" y="241.0" font-size="12.5" fill="#171307" text-anchor="end" font-weight="400">Frustration tendency</text><rect x="232" y="229.0" width="458" height="14" rx="4" fill="#F7F1DF"/><rect x="232" y="229.0" width="128.2" height="14" rx="4" fill="#C2410C" fill-opacity="0.85"/><text x="702.0" y="241.0" font-size="10.5" fill="#7D7360" text-anchor="start" font-weight="400">rarely escalates</text><text x="352.2" y="241.0" font-size="10" fill="#FFFDF7" text-anchor="end" font-weight="500" font-family="'Geist Mono', ui-monospace, Menlo, monospace">0.28</text><text x="216.0" y="283.0" font-size="12.5" fill="#171307" text-anchor="end" font-weight="400">Constructive engagement</text><rect x="232" y="271.0" width="458" height="14" rx="4" fill="#F7F1DF"/><rect x="232" y="271.0" width="352.7" height="14" rx="4" fill="#2563EB" fill-opacity="0.85"/><text x="702.0" y="283.0" font-size="10.5" fill="#7D7360" text-anchor="start" font-weight="400">asks about method, not answers</text><text x="576.7" y="283.0" font-size="10" fill="#FFFDF7" text-anchor="end" font-weight="500" font-family="'Geist Mono', ui-monospace, Menlo, monospace">0.77</text><line x1="20" y1="332" x2="820" y2="332" stroke="#E6DCC2"/><text x="20.0" y="360.0" font-size="9.5" fill="#7D7360" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">DEMONSTRATED CEILING</text><text x="20.0" y="384.0" font-size="16" fill="#7A4E00" text-anchor="start" font-weight="500">intermediate</text><text x="20.0" y="402.0" font-size="10.5" fill="#7D7360" text-anchor="start" font-weight="400">cleared unaided, repeatedly</text><text x="286.7" y="360.0" font-size="9.5" fill="#7D7360" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">NEXT PROBLEM AIMED AT</text><text x="286.7" y="384.0" font-size="16" fill="#7A4E00" text-anchor="start" font-weight="500">just above it</text><text x="286.7" y="402.0" font-size="10.5" fill="#7D7360" text-anchor="start" font-weight="400">the edge, not the comfort zone</text><text x="553.3" y="360.0" font-size="9.5" fill="#7D7360" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">READINESS VERDICT</text><text x="553.3" y="384.0" font-size="16" fill="#7A4E00" text-anchor="start" font-weight="500">reliable</text><text x="553.3" y="402.0" font-size="10.5" fill="#7D7360" text-anchor="start" font-weight="400">enough evidence to act on</text></svg>