<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-labelledby="t d" font-family="Geist, ui-sans-serif, -apple-system, sans-serif"><title id="t">The Handwriting 3 pipeline</title><desc id="d">Parse and lay out, humanize the layout, match captured templates per symbol or phrase, warp them into the slots, compose strokes carrying real pen attributes, schedule the timing, animate onto the canvas. The fallback to Handwriting 2 is layered at the glyph, line and bundle level.</desc><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B5340"/></marker><marker id="arw-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect width="1180" height="560" fill="#FFFDF7"/><text x="28.0" y="34.0" font-size="15" fill="#171307" text-anchor="start" font-weight="500">Handwriting 3: how a string becomes real pen strokes</text><text x="28.0" y="56.0" font-size="12" fill="#7D7360" text-anchor="start" font-weight="400">The glyphs are captured human handwriting, warped into a typeset layout. Nothing here is a font and nothing is drawn by formula.</text><rect x="28" y="92" width="250" height="128" rx="12" fill="#F7F1DF" stroke="#E9B11E" stroke-width="2"/><text x="153.0" y="118.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Parse and lay out</text><text x="153.0" y="135.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">shared front end</text><text x="153.0" y="154.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">A tight LaTeX subset becomes an AST,</text><text x="153.0" y="168.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">then a stream of positioned slots.</text><text x="153.0" y="182.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Geometry only, no ink yet.</text><rect x="308" y="92" width="250" height="128" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="433.0" y="118.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Layout humanizer</text><text x="433.0" y="135.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">one hand, not noise</text><text x="433.0" y="154.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Slant, size bias and a baseline wave</text><text x="433.0" y="168.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">drawn ONCE per render and applied to</text><text x="433.0" y="182.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">every slot, so the line shares a lean.</text><line x1="282" y1="156.0" x2="304" y2="156.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="588" y="92" width="250" height="128" rx="12" fill="#F7F1DF" stroke="#E9B11E" stroke-width="2"/><text x="713.0" y="118.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Phrase and template match</text><text x="713.0" y="135.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">captured, not synthesised</text><text x="713.0" y="154.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Picks real captured handwriting per</text><text x="713.0" y="168.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">symbol, or one phrase template across</text><text x="713.0" y="182.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">a run. Phrases win where they exist.</text><line x1="562" y1="156.0" x2="584" y2="156.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="868" y="92" width="250" height="128" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="993.0" y="118.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Template warper</text><text x="993.0" y="135.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">fit without mush</text><text x="993.0" y="154.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Affine into the slot, baseline aligned.</text><text x="993.0" y="168.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Horizontal scale clamped to within 33%</text><text x="993.0" y="182.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">of vertical; phrases warp aspect-locked.</text><line x1="842" y1="156.0" x2="864" y2="156.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><line x1="993.0" y1="224" x2="993.0" y2="272" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="868" y="276" width="250" height="128" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="993.0" y="302.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Handwriting2Animator</text><text x="993.0" y="319.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">onto their canvas</text><text x="993.0" y="338.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Plays the schedule stroke by stroke</text><text x="993.0" y="352.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">onto the student's own PKCanvasView.</text><rect x="588" y="276" width="250" height="128" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="713.0" y="302.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">SemanticStrokeScheduler</text><text x="713.0" y="319.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">the timing truth</text><text x="713.0" y="338.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">One pure function. Live render, debug</text><text x="713.0" y="352.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">overlay and tests agree by construction.</text><line x1="864" y1="340.0" x2="842" y2="340.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="308" y="276" width="250" height="128" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="433.0" y="302.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Stroke composer</text><text x="433.0" y="319.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">real pen attributes</text><text x="433.0" y="338.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Carries the captured pressure, width</text><text x="433.0" y="352.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">and timing through into PKStrokes.</text><line x1="584" y1="340.0" x2="562" y2="340.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="28" y="276" width="250" height="128" rx="12" fill="#F7F1DF" stroke="#E9B11E" stroke-width="2"/><text x="153.0" y="302.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Real strokes, not a font</text><text x="153.0" y="319.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">the output</text><text x="153.0" y="338.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Erasable, selectable and zoomable</text><text x="153.0" y="352.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">exactly like the student's own ink,</text><text x="153.0" y="366.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">in their own coordinate space.</text><line x1="304" y1="340.0" x2="282" y2="340.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="28" y="438" width="1124" height="86" rx="12" fill="#F7F1DF" stroke="#C2410C" stroke-width="2"/><text x="48.0" y="464.0" font-size="13" fill="#171307" text-anchor="start" font-weight="500">The fallback is a ladder, not a switch</text><text x="48.0" y="484.0" font-size="11.5" fill="#7D7360" text-anchor="start" font-weight="400">A missing glyph mixes in Handwriting 2 ink for that one symbol.  A line with poor template coverage, or one that will not parse, is rendered</text><text x="48.0" y="501.0" font-size="11.5" fill="#7D7360" text-anchor="start" font-weight="400">wholesale by Handwriting 2.  A missing or corrupt template bundle degrades to an empty store, which makes coverage zero and hands the whole render back.</text><text x="48.0" y="518.0" font-size="11.5" fill="#7D7360" text-anchor="start" font-weight="400">Every level is silent and none of them can produce garbage ink. A tutor that writes nothing is a worse failure than one whose hand is a generation old.</text></svg>