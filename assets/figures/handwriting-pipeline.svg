<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-labelledby="t d" font-family="Geist, ui-sans-serif, -apple-system, sans-serif"><title id="t">The Handwriting 2 pipeline</title><desc id="d">Five stages: parser, layout engine, stroke composer, scheduler, animator. Any parse or layout failure falls back to the older glyph-stamp renderer.</desc><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B5340"/></marker><marker id="arw-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect width="1180" height="470" fill="#FFFDF7"/><text x="28.0" y="34.0" font-size="15" fill="#171307" text-anchor="start" font-weight="500">Handwriting 2: how a string becomes pen strokes</text><text x="28.0" y="56.0" font-size="12" fill="#7D7360" text-anchor="start" font-weight="400">Five pure stages. Each one emits a different kind of thing, which is why they can be tested separately.</text><rect x="28" y="96" width="178" height="112" rx="12" fill="#F7F1DF" stroke="#E9B11E" stroke-width="2"/><text x="117.0" y="122.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">MathExpressionParser</text><text x="117.0" y="139.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">LaTeX to AST</text><text x="117.0" y="158.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">A tight LaTeX subset:</text><text x="117.0" y="172.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">fractions, radicals,</text><text x="117.0" y="186.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">super and subscripts</text><rect x="258" y="96" width="178" height="112" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="347.0" y="122.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">HandwrittenLayoutEngine</text><text x="347.0" y="139.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">AST to geometry</text><text x="347.0" y="158.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Positions every glyph.</text><text x="347.0" y="172.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Emits geometry only,</text><text x="347.0" y="186.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">never ink properties</text><line x1="212" y1="152.0" x2="252" y2="152.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="488" y="96" width="178" height="112" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="577.0" y="122.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">ExpressionStrokeComposer</text><text x="577.0" y="139.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">geometry to ink</text><text x="577.0" y="158.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Jitter, baseline drift,</text><text x="577.0" y="172.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">slant sheared on the</text><text x="577.0" y="186.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">expression baseline</text><line x1="442" y1="152.0" x2="482" y2="152.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="718" y="96" width="178" height="112" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="807.0" y="122.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">SemanticStrokeScheduler</text><text x="807.0" y="139.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">ink to timeline</text><text x="807.0" y="158.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">The single source of</text><text x="807.0" y="172.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">timing truth. Pure</text><text x="807.0" y="186.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">function of its input</text><line x1="672" y1="152.0" x2="712" y2="152.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="948" y="96" width="178" height="112" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="1037.0" y="122.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Handwriting2Animator</text><text x="1037.0" y="139.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">timeline to canvas</text><text x="1037.0" y="158.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Plays the schedule</text><text x="1037.0" y="172.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">onto the student's</text><text x="1037.0" y="186.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">own PKCanvasView</text><line x1="902" y1="152.0" x2="942" y2="152.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><line x1="116" y1="214" x2="116" y2="248" stroke="#C2410C" stroke-width="2" marker-end="url(#arw-fb)" stroke-dasharray="6 5"/><text x="130.0" y="238.0" font-size="10.5" fill="#C2410C" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">on any parse or layout failure</text><rect x="28" y="254" width="330" height="92" rx="12" fill="#F7F1DF" stroke="#C2410C" stroke-width="2"/><text x="193.0" y="280.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">MathHandwritingRenderer</text><text x="193.0" y="297.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">production fallback</text><text x="193.0" y="316.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">The previous glyph-stamp engine.</text><text x="193.0" y="330.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Still shipped, still the fallback.</text><rect x="388" y="254" width="360" height="92" rx="12" fill="#F7F1DF" stroke="#E9B11E" stroke-width="2"/><text x="568.0" y="280.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Real pen strokes, not a font</text><text x="568.0" y="302.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">PKStroke objects on the student's canvas.</text><text x="568.0" y="316.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Erasable, selectable, zoomable like their own ink.</text><rect x="778" y="254" width="402" height="92" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="979.0" y="280.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Handwriting Lab</text><text x="979.0" y="297.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">the iteration surface</text><text x="979.0" y="316.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Every constant above is live-tunable in the app.</text><text x="979.0" y="330.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Its defaults match the baked v2 values exactly.</text><rect x="28" y="366" width="1124" height="54" rx="12" fill="#FFFDF7" stroke="#E6DCC2" stroke-width="2" stroke-dasharray="6 5"/><text x="44.0" y="390.0" font-size="12" fill="#171307" text-anchor="start" font-weight="500">Deterministic given a seed</text><text x="44.0" y="408.0" font-size="11.5" fill="#7D7360" text-anchor="start" font-weight="400">The only stochastic element is inter-stroke pause noise. The same string and seed produce the same strokes, so the schedule can be asserted in a test rather than eyeballed.</text></svg>