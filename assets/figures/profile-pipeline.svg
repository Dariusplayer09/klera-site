<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" width="1180" height="500" role="img" aria-labelledby="t d" font-family="Geist, ui-sans-serif, -apple-system, sans-serif"><title id="t">The learner-profile pipeline</title><desc id="d">Pencil samples become per-attempt features, which feed a per-student baseline, which produces standard scores, which feed four detectors. Two gates stand in the way, and before either opens the reads downstream are zero by construction.</desc><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B5340"/></marker><marker id="arw-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect width="1180" height="500" fill="#FFFDF7"/><text x="28.0" y="34.0" font-size="15" fill="#171307" text-anchor="start" font-weight="500">The learner profile: from pen samples to what the tutor says</text><text x="28.0" y="56.0" font-size="12" fill="#7D7360" text-anchor="start" font-weight="400">Yellow badges are gates. Before a gate opens, every read downstream of it is zero by construction, not by measurement.</text><rect x="28" y="100" width="206" height="116" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="131.0" y="126.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Pencil samples</text><text x="131.0" y="143.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">PKStroke</text><text x="131.0" y="162.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Force, azimuth, altitude,</text><text x="131.0" y="176.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">timestamp, per point,</text><text x="131.0" y="190.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">at the tablet's own rate</text><rect x="264" y="100" width="206" height="116" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="367.0" y="126.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Per-attempt features</text><text x="367.0" y="143.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">Kinematics</text><text x="367.0" y="162.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Mean force, speed,</text><text x="367.0" y="176.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">jerkiness, pre-stroke</text><text x="367.0" y="190.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">pause, erase bursts</text><line x1="240" y1="158.0" x2="258" y2="158.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="500" y="100" width="206" height="116" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="603.0" y="126.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Per-student baseline</text><text x="603.0" y="143.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">RobustStat</text><text x="603.0" y="162.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Running centre and MAD,</text><text x="603.0" y="176.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">debiased for warm-up.</text><text x="603.0" y="190.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">One baseline per student</text><line x1="476" y1="158.0" x2="494" y2="158.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="736" y="100" width="206" height="116" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="839.0" y="126.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Standard scores</text><text x="839.0" y="143.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">KinematicZ</text><text x="839.0" y="162.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">zForce, zSpeed, zJerk,</text><text x="839.0" y="176.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">and a separate pause z</text><text x="839.0" y="190.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">from the pace baseline</text><line x1="712" y1="158.0" x2="730" y2="158.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="972" y="100" width="180" height="116" rx="12" fill="#F7F1DF" stroke="#E9B11E" stroke-width="2"/><text x="1062.0" y="126.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Detectors</text><text x="1062.0" y="143.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">PenSignalDetectors</text><text x="1062.0" y="162.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">dysfluency, strain,</text><text x="1062.0" y="176.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">struggle, pause kind</text><line x1="948" y1="158.0" x2="966" y2="158.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="462.0" y="230" width="282" height="24" rx="12" fill="#E9B11E"/><text x="603.0" y="246.0" font-size="10.5" fill="#171307" text-anchor="middle" font-weight="500" font-family="'Geist Mono', ui-monospace, Menlo, monospace">12 clean samples before it opens</text><rect x="706.0" y="230" width="266" height="24" rx="12" fill="#E9B11E"/><text x="839.0" y="246.0" font-size="10.5" fill="#171307" text-anchor="middle" font-weight="500" font-family="'Geist Mono', ui-monospace, Menlo, monospace">&gt;=5 strokes and &gt;=5s, else nil</text><rect x="28" y="292" width="1124" height="120" rx="12" fill="#F7F1DF" stroke="#E6DCC2" stroke-width="2"/><text x="48.0" y="318.0" font-size="13" fill="#171307" text-anchor="start" font-weight="500">The two reads, exactly as they are computed</text><text x="48.0" y="344.0" font-size="13" fill="#171307" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">dysfluency  =  sigmoid( 0.7 * zJerk  +  0.5 * max(0, -zSpeed)  -  1.0 )</text><text x="48.0" y="366.0" font-size="13" fill="#171307" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">strain      =  sigmoid( 0.8 * zForce  -  1.0 )  *  paired</text><text x="48.0" y="390.0" font-size="11.5" fill="#7D7360" text-anchor="start" font-weight="400">paired is 1.0 when the attempt is known not to have progressed or has two erase bursts, and 0.3 otherwise. An unjudged attempt takes the 0.3, because whether our verifier got round to marking the work is a fact about our budget, not about the student.</text><rect x="28" y="438" width="300" height="86" rx="12" fill="#F7F1DF" stroke="#E9B11E" stroke-width="2"/><text x="178.0" y="464.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">TeachingContext</text><text x="178.0" y="481.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">LearnerGuidanceEngine</text><text x="178.0" y="500.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">A prompt-ready summary. The engine</text><text x="178.0" y="514.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">that builds it is pure and stateless.</text><line x1="334" y1="481" x2="380" y2="481" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="386" y="438" width="300" height="86" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="536.0" y="464.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">The tutor's next turn</text><text x="536.0" y="486.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Which hint, what tone, how fast to</text><text x="536.0" y="500.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">reveal, what difficulty comes next.</text><rect x="744" y="438" width="408" height="86" rx="12" fill="#F7F1DF" stroke="#C2410C" stroke-width="2"/><text x="948.0" y="464.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Never shown to the student</text><text x="948.0" y="486.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">No score, no streak, no progress bar. A student told they are</text><text x="948.0" y="500.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">at 71 percent does not learn anything from the number.</text></svg>