<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 949" width="900" height="949" role="img" aria-labelledby="t d" font-family="Geist, ui-sans-serif, -apple-system, sans-serif"><title id="t">The learner-profile stack</title><desc id="d">Six bands, top to bottom: measure, normalise against this student, score, interpret, remember across sessions, and act then check it worked, with the effectiveness result feeding back into how the student is taught.</desc><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B5340"/></marker><marker id="arw-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect width="900" height="949" fill="#FFFDF7"/><text x="28.0" y="34.0" font-size="15" fill="#171307" text-anchor="start" font-weight="500">The learner profile: six kinds of work on one student</text><text x="28.0" y="56.0" font-size="12" fill="#7D7360" text-anchor="start" font-weight="400">No single signal decides anything. Each band is weak on its own and the fusion is what is accurate.</text><rect x="28" y="92" width="844" height="154" rx="12" fill="#F7F1DF" stroke="#E9B11E" stroke-width="2"/><rect x="28" y="92" width="6" height="154" rx="3" fill="#E9B11E"/><text x="48.0" y="118.0" font-size="14" fill="#171307" text-anchor="start" font-weight="500">Measure</text><text x="48.0" y="136.0" font-size="10.5" fill="#7A4E00" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">every attempt, continuously</text><text x="48.0" y="156.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">Pen kinematics:  force, speed, jerkiness, pre-stroke pause, erase bursts, stroke fluency</text><text x="48.0" y="171.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">Help behaviour:  which rung of the ladder, whether they tried first, how fast a hint is taken up</text><text x="48.0" y="186.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">Work structure:  valid steps, the line the error starts on, self-correction, copy likelihood</text><text x="48.0" y="201.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">Silent verification:  the background check that marks finished work nobody asked us to mark</text><text x="48.0" y="216.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">Language:  distress and constructive-question hits, plus a model read of how they sound</text><text x="48.0" y="231.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">Difficulty:  what they attempt and what they finish unaided, per level, decayed over months</text><rect x="28" y="260" width="844" height="109" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><rect x="28" y="260" width="6" height="109" rx="3" fill="#CFC2A0"/><text x="48.0" y="286.0" font-size="14" fill="#171307" text-anchor="start" font-weight="500">Normalise</text><text x="48.0" y="304.0" font-size="10.5" fill="#7A4E00" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">against this student, never a population</text><text x="48.0" y="324.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">Robust running centre and deviation per signal, warm-up debiased so an early sample</text><text x="48.0" y="339.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">cannot anchor the estimate. Two gates: 12 clean samples before the kinematic baseline</text><text x="48.0" y="354.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">opens, and at least 5 strokes and 5 active seconds before an attempt may be scored.</text><line x1="450.0" y1="247" x2="450.0" y2="258" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="28" y="383" width="844" height="109" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><rect x="28" y="383" width="6" height="109" rx="3" fill="#CFC2A0"/><text x="48.0" y="409.0" font-size="14" fill="#171307" text-anchor="start" font-weight="500">Score</text><text x="48.0" y="427.0" font-size="10.5" fill="#7A4E00" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">standard scores and four detectors</text><text x="48.0" y="447.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">zForce, zSpeed, zJerk against the kinematic baseline. A separate pause z against the</text><text x="48.0" y="462.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">pace baseline, bucketed by difficulty. From those: dysfluency, pressure strain,</text><text x="48.0" y="477.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">productive and unproductive struggle, and the kind of pause.</text><line x1="450.0" y1="370" x2="450.0" y2="381" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="28" y="506" width="844" height="109" rx="12" fill="#F7F1DF" stroke="#2563EB" stroke-width="2"/><rect x="28" y="506" width="6" height="109" rx="3" fill="#2563EB"/><text x="48.0" y="532.0" font-size="14" fill="#171307" text-anchor="start" font-weight="500">Interpret</text><text x="48.0" y="550.0" font-size="10.5" fill="#7A4E00" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">two layers, deliberately separate</text><text x="48.0" y="570.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">Six composite reads per attempt, each with its own confidence: productive struggle,</text><text x="48.0" y="585.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">destructive struggle, anxiety risk, boredom risk, flow-like, help dependence.</text><text x="48.0" y="600.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">Five live flow bands: apathy, boredom, flow, confusion, frustration.</text><line x1="450.0" y1="493" x2="450.0" y2="504" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="28" y="629" width="844" height="109" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><rect x="28" y="629" width="6" height="109" rx="3" fill="#CFC2A0"/><text x="48.0" y="655.0" font-size="14" fill="#171307" text-anchor="start" font-weight="500">Remember</text><text x="48.0" y="673.0" font-size="10.5" fill="#7A4E00" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">slowly, across sessions</text><text x="48.0" y="693.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">Five traits folded by EWMA with a 120-day half-life and a five-observation floor:</text><text x="48.0" y="708.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">help orientation, competence, frustration tendency, uptake speed, constructive</text><text x="48.0" y="723.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">engagement. Plus a demonstrated difficulty ceiling and one readiness verdict.</text><line x1="450.0" y1="616" x2="450.0" y2="627" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="28" y="752" width="844" height="109" rx="12" fill="#F7F1DF" stroke="#C2410C" stroke-width="2"/><rect x="28" y="752" width="6" height="109" rx="3" fill="#C2410C"/><text x="48.0" y="778.0" font-size="14" fill="#171307" text-anchor="start" font-weight="500">Act, then check it worked</text><text x="48.0" y="796.0" font-size="10.5" fill="#7A4E00" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">the loop that closes</text><text x="48.0" y="816.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">A prompt-ready teaching context picks the rung, the tone, the pace and what comes next.</text><text x="48.0" y="831.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">Every intervention is then scored by what the student did next and folded back into the</text><text x="48.0" y="846.0" font-size="11" fill="#7D7360" text-anchor="start" font-weight="400">arm that produced it, so a mapping that is wrong for this student stops being used.</text><line x1="450.0" y1="739" x2="450.0" y2="750" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><path d="M 872 806.5 H 886 V 169.0 H 872" fill="none" stroke="#C2410C" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arw-fb)"/><text x="866.0" y="84.0" font-size="10.5" fill="#C2410C" text-anchor="end" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">what worked feeds back in</text><text x="28.0" y="909.0" font-size="12" fill="#171307" text-anchor="start" font-weight="500">Never shown to the student. No score, no streak, no progress bar.</text><text x="28.0" y="927.0" font-size="11.5" fill="#7D7360" text-anchor="start" font-weight="400">A student told they are at 71 percent learns nothing from the number, and starts working for the number instead of the problem.</text></svg>