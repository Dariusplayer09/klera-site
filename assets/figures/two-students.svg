<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 352" width="840" height="352" role="img" aria-labelledby="t d" font-family="Geist, ui-sans-serif, -apple-system, sans-serif"><title id="t">The same detector, two students</title><desc id="d">Pressure strain separates the first student's stuck attempt cleanly from their calm range, and is completely flat for the second student, whose stuck attempts sit inside their calm range.</desc><rect width="840" height="352" fill="#FFFDF7"/><text x="20.0" y="26.0" font-size="15" fill="#171307" text-anchor="start" font-weight="500">The same detector, two students</text><text x="20.0" y="44.0" font-size="12" fill="#7D7360" text-anchor="start" font-weight="400">Same signal, same scale, one panel per student.</text><rect x="138" y="62" width="680" height="92" rx="10" fill="#FFFDF7" stroke="#E6DCC2"/><line x1="150.0" y1="72" x2="150.0" y2="144" stroke="#E6DCC2" stroke-width="1"/><line x1="243.7" y1="72" x2="243.7" y2="144" stroke="#E6DCC2" stroke-width="1"/><line x1="337.4" y1="72" x2="337.4" y2="144" stroke="#E6DCC2" stroke-width="1"/><line x1="431.1" y1="72" x2="431.1" y2="144" stroke="#E6DCC2" stroke-width="1"/><line x1="524.9" y1="72" x2="524.9" y2="144" stroke="#E6DCC2" stroke-width="1"/><line x1="618.6" y1="72" x2="618.6" y2="144" stroke="#E6DCC2" stroke-width="1"/><line x1="712.3" y1="72" x2="712.3" y2="144" stroke="#E6DCC2" stroke-width="1"/><line x1="806.0" y1="72" x2="806.0" y2="144" stroke="#E6DCC2" stroke-width="1"/><line x1="712.3" y1="68" x2="712.3" y2="148" stroke="#5B5340" stroke-width="2" stroke-dasharray="5 4"/><text x="124.0" y="104.0" font-size="14" fill="#171307" text-anchor="end" font-weight="500">Student A</text><text x="124.0" y="122.0" font-size="11" fill="#7D7360" text-anchor="end" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">run 004, n=8 calm, 1 stuck</text><rect x="178.1" y="101.0" width="196.8" height="14" rx="4" fill="#2563EB" fill-opacity="0.24"/><line x1="178.1" y1