<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-labelledby="t d" font-family="Geist, ui-sans-serif, -apple-system, sans-serif"><title id="t">The visualisation cascade</title><desc id="d">Detection feeds a router, then five tiers from a curated template down to a local fallback that never fails. A two-part quality gate sits between the generated tiers and the screen.</desc><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B5340"/></marker><marker id="arw-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect width="1180" height="470" fill="#FFFDF7"/><text x="28.0" y="34.0" font-size="15" fill="#171307" text-anchor="start" font-weight="500">The visualisation cascade: the model recommends, the engine decides</text><text x="28.0" y="56.0" font-size="12" fill="#7D7360" text-anchor="start" font-weight="400">A generated diagram that is wrong is worse than no diagram, so every tier can be refused and the last one cannot fail.</text><rect x="28" y="92" width="200" height="104" rx="12" fill="#F7F1DF" stroke="#E9B11E" stroke-width="2"/><text x="128.0" y="118.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Detection</text><text x="128.0" y="135.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">classify</text><text x="128.0" y="154.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Is a picture worth drawing</text><text x="128.0" y="168.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">here, and of what?</text><line x1="234" y1="144" x2="268" y2="144" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="274" y="92" width="200" height="104" rx="12" fill="#F7F1DF" stroke="#CFC2A0" stroke-width="2"/><text x="374.0" y="118.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Viz3DRouter</text><text x="374.0" y="135.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">route</text><text x="374.0" y="154.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Renders 3D only when the</text><text x="374.0" y="168.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">third dimension earns it.</text><text x="374.0" y="182.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">A parabola stays flat.</text><rect x="28" y="232" width="210" height="118" rx="12" fill="#F7F1DF" stroke="#2563EB" stroke-width="2"/><text x="133.0" y="258.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Tier 0</text><text x="133.0" y="275.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">curated template</text><text x="133.0" y="294.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">A hand-written JSXGraph</text><text x="133.0" y="308.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">template. Params validated</text><text x="133.0" y="322.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">against a whitelist first.</text><rect x="252" y="232" width="210" height="118" rx="12" fill="#F7F1DF" stroke="#2563EB" stroke-width="2"/><text x="357.0" y="258.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Tier 0-3D</text><text x="357.0" y="275.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">validated spec</text><text x="357.0" y="294.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">A spatial spec, routed</text><text x="357.0" y="308.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">before the 2D tiers when</text><text x="357.0" y="322.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">the router allows it.</text><line x1="244" y1="291.0" x2="250" y2="291.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><text x="247.0" y="281.0" font-size="10" fill="#C2410C" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">refused</text><rect x="476" y="232" width="210" height="118" rx="12" fill="#F7F1DF" stroke="#E9B11E" stroke-width="2"/><text x="581.0" y="258.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Tier 1</text><text x="581.0" y="275.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">generated script</text><text x="581.0" y="294.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">The model writes JSXGraph.</text><text x="581.0" y="308.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">First tier that can be</text><text x="581.0" y="322.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">wrong, so it is gated.</text><line x1="468" y1="291.0" x2="474" y2="291.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><text x="471.0" y="281.0" font-size="10" fill="#C2410C" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">refused</text><rect x="700" y="232" width="210" height="118" rx="12" fill="#F7F1DF" stroke="#E9B11E" stroke-width="2"/><text x="805.0" y="258.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Tier 2</text><text x="805.0" y="275.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">generated HTML</text><text x="805.0" y="294.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">A full interactive widget</text><text x="805.0" y="308.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">in a sandboxed shell.</text><text x="805.0" y="322.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Also gated.</text><line x1="692" y1="291.0" x2="698" y2="291.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><text x="695.0" y="281.0" font-size="10" fill="#C2410C" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">refused</text><rect x="924" y="232" width="210" height="118" rx="12" fill="#F7F1DF" stroke="#C2410C" stroke-width="2"/><text x="1029.0" y="258.0" font-size="13.5" fill="#171307" text-anchor="middle" font-weight="500">Tier 3</text><text x="1029.0" y="275.0" font-size="10.5" fill="#7A4E00" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">local fallback</text><text x="1029.0" y="294.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">Never fails and never</text><text x="1029.0" y="308.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">invents mathematics. Asks</text><text x="1029.0" y="322.0" font-size="11.5" fill="#7D7360" text-anchor="middle" font-weight="400">for a retry instead.</text><line x1="916" y1="291.0" x2="922" y2="291.0" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><text x="919.0" y="281.0" font-size="10" fill="#C2410C" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">refused</text><line x1="374" y1="202" x2="133" y2="226" stroke="#5B5340" stroke-width="2" marker-end="url(#arw)"/><rect x="28" y="384" width="1124" height="76" rx="12" fill="#F7F1DF" stroke="#E9B11E" stroke-width="2"/><text x="48.0" y="410.0" font-size="13" fill="#171307" text-anchor="start" font-weight="500">Quality gate, between the generated tiers and the screen</text><text x="48.0" y="430.0" font-size="11.5" fill="#7D7360" text-anchor="start" font-weight="400">Static half: generated code referencing an escape hatch is rejected before it reaches a web view, on top of a CSP that already blocks the network.</text><text x="48.0" y="447.0" font-size="11.5" fill="#7D7360" text-anchor="start" font-weight="400">Dynamic half: the widget is rendered once off-screen and must clear instrumentation minimums. Anything that fails either half falls to the next tier down.</text></svg>