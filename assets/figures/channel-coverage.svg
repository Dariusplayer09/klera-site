<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 456" width="840" height="456" role="img" aria-labelledby="t d" font-family="Geist, ui-sans-serif, -apple-system, sans-serif"><title id="t">Why no single channel is enough</title><desc id="d">Modelled share of students whose genuine struggle a channel separates from their own calm work. Single channels range from 24 to 52 percent. All six fused reach 93 percent.</desc><rect width="840" height="456" fill="#FFFDF7"/><text x="20.0" y="26.0" font-size="15" fill="#171307" text-anchor="start" font-weight="500">Why no single channel is enough</text><text x="20.0" y="46.0" font-size="11.5" fill="#7D7360" text-anchor="start" font-weight="400">Share of students whose genuine struggle the channel separates from their own calm work.</text><text x="20.0" y="64.0" font-size="10" fill="#7A4E00" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">MODELLED from the instrumented runs, not counted from logs.</text><line x1="244.0" y1="84" x2="244.0" y2="352" stroke="#E6DCC2" stroke-width="1"/><text x="244.0" y="416.0" font-size="11" fill="#7D7360" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">0%</text><line x1="370.0" y1="84" x2="370.0" y2="352" stroke="#E6DCC2" stroke-width="1"/><text x="370.0" y="416.0" font-size="11" fill="#7D7360" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">25%</text><line x1="496.0" y1="84" x2="496.0" y2="352" stroke="#E6DCC2" stroke-width="1"/><text x="496.0" y="416.0" font-size="11" fill="#7D7360" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">50%</text><line x1="622.0" y1="84" x2="622.0" y2="352" stroke="#E6DCC2" stroke-width="1"/><text x="622.0" y="416.0" font-size="11" fill="#7D7360" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">75%</text><line x1="748.0" y1="84" x2="748.0" y2="352" stroke="#E6DCC2" stroke-width="1"/><text x="748.0" y="416.0" font-size="11" fill="#7D7360" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">100%</text><text x="228.0" y="108.0" font-size="12.5" fill="#5B5340" text-anchor="end" font-weight="400">Pressure strain alone</text><rect x="244" y="93.0" width="156.2" height="18" rx="4" fill="#2563EB" fill-opacity="0.55"/><text x="410.2" y="108.0" font-size="12" fill="#7D7360" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">31%</text><text x="228.0" y="154.0" font-size="12.5" fill="#5B5340" text-anchor="end" font-weight="400">Stroke dysfluency alone</text><rect x="244" y="139.0" width="121.0" height="18" rx="4" fill="#2563EB" fill-opacity="0.55"/><text x="375.0" y="154.0" font-size="12" fill="#7D7360" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">24%</text><text x="228.0" y="200.0" font-size="12.5" fill="#5B5340" text-anchor="end" font-weight="400">Pre-stroke pause alone</text><rect x="244" y="185.0" width="221.8" height="18" rx="4" fill="#2563EB" fill-opacity="0.55"/><text x="475.8" y="200.0" font-size="12" fill="#7D7360" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">44%</text><text x="228.0" y="246.0" font-size="12.5" fill="#5B5340" text-anchor="end" font-weight="400">Erase-burst pattern alone</text><rect x="244" y="231.0" width="146.2" height="18" rx="4" fill="#2563EB" fill-opacity="0.55"/><text x="400.2" y="246.0" font-size="12" fill="#7D7360" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">28%</text><text x="228.0" y="292.0" font-size="12.5" fill="#5B5340" text-anchor="end" font-weight="400">Help behaviour alone</text><rect x="244" y="277.0" width="262.1" height="18" rx="4" fill="#2563EB" fill-opacity="0.55"/><text x="516.1" y="292.0" font-size="12" fill="#7D7360" text-anchor="start" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">52%</text><text x="228.0" y="338.0" font-size="12.5" fill="#171307" text-anchor="end" font-weight="500">All six families fused</text><rect x="244" y="323.0" width="468.7" height="18" rx="4" fill="#2563EB" fill-opacity="0.9" stroke="#171307" stroke-width="2"/><text x="722.7" y="338.0" font-size="12" fill="#171307" text-anchor="start" font-weight="500" font-family="'Geist Mono', ui-monospace, Menlo, monospace">93%</text><text x="20.0" y="442.0" font-size="11.5" fill="#5B5340" text-anchor="start" font-weight="400">Each channel is unreliable for most students. That is the argument for fusion, not for a better single detector.</text></svg>