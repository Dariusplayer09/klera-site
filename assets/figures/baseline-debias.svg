<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 334" width="840" height="334" role="img" aria-labelledby="t d" font-family="Geist, ui-sans-serif, -apple-system, sans-serif"><title id="t">Jerk z-scores before and after the estimator fix</title><desc id="d">Run 002 produced five positive jerk z-scores out of five, spanning plus 0.80 to plus 1.12. After the warm-up debias, run 004 spanned minus 3.39 to plus 0.51 with eight of nine negative.</desc><rect width="840" height="334" fill="#FFFDF7"/><text x="20.0" y="26.0" font-size="15" fill="#171307" text-anchor="start" font-weight="500">Jerk z-scores before and after the estimator fix</text><text x="20.0" y="46.0" font-size="12" fill="#7D7360" text-anchor="start" font-weight="400">One student, same device. A z-score against your own normal should sit on both sides of zero.</text><text x="194.0" y="98.0" font-size="13" fill="#171307" text-anchor="end" font-weight="500">Run 002, biased estimator</text><line x1="210.0" y1="100.0" x2="806.0" y2="100.0" stroke="#E6DCC2" stroke-width="1"/><line x1="607.3" y1="78.0" x2="607.3" y2="122.0" stroke="#5B5340" stroke-width="2"/><circle cx="717.6" cy="100.0" r="7" fill="#C2410C" stroke="#FFFDF7" stroke-width="2"/><circle cx="716.6" cy="100.0" r="7" fill="#C2410C" stroke="#FFFDF7" stroke-width="2"/><circle cx="718.6" cy="100.0" r="7" fill="#C2410C" stroke="#FFFDF7" stroke-width="2"/><circle cx="686.8" cy="100.0" r="7" fill="#C2410C" stroke="#FFFDF7" stroke-width="2"/><circle cx="693.8" cy="100.0" r="7" fill="#C2410C" stroke="#FFFDF7" stroke-width="2"/><text x="210.0" y="134.0" font-size="12" fill="#5B5340" text-anchor="start" font-weight="400">All five post-baseline reads positive. Centre still under-converged after 12 samples.</text><text x="194.0" y="202.0" font-size="13" fill="#171307" text-anchor="end" font-weight="500">Run 004, warm-up debiased</text><line x1="210.0" y1="204.0" x2="806.0" y2="204.0" stroke="#E6DCC2" stroke-width="1"/><line x1="607.3" y1="182.0" x2="607.3" y2="226.0" stroke="#5B5340" stroke-width="2"/><rect x="270.6" y="197.0" width="387.4" height="14" rx="4" fill="#2563EB" fill-opacity="0.24"/><line x1="270.6" y1="193.0" x2="270.6" y2="215.0" stroke="#2563EB" stroke-width="2"/><circle cx="270.6" cy="204.0" r="7" fill="#2563EB" stroke="#FFFDF7" stroke-width="2"/><line x1="658.0" y1="193.0" x2="658.0" y2="215.0" stroke="#2563EB" stroke-width="2"/><circle cx="658.0" cy="204.0" r="7" fill="#2563EB" stroke="#FFFDF7" stroke-width="2"/><text x="210.0" y="238.0" font-size="12" fill="#5B5340" text-anchor="start" font-weight="400">Range only: 8 of 9 negative, straddling zero. The nine values are not published individually.</text><text x="210.0" y="304.0" font-size="11" fill="#7D7360" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">-4</text><text x="309.3" y="304.0" font-size="11" fill="#7D7360" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">-3</text><text x="408.7" y="304.0" font-size="11" fill="#7D7360" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">-2</text><text x="508.0" y="304.0" font-size="11" fill="#7D7360" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">-1</text><text x="607.3" y="304.0" font-size="11" fill="#7D7360" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">0</text><text x="706.7" y="304.0" font-size="11" fill="#7D7360" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">+1</text><text x="806.0" y="304.0" font-size="11" fill="#7D7360" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace">+2</text><text x="508.0" y="324.0" font-size="12" fill="#7D7360" text-anchor="middle" font-weight="400">jerk z-score against this student's own baseline</text></svg>